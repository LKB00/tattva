    <!-- A prebuilt page (/tattva/component-button/, see scripts/prerender.mjs) becomes the app's own address
         (/tattva/#component-button) before the app starts; a #section on it becomes component-button~section. -->
    <script>
      (function () {
        var b = "/tattva/", p = location.pathname;
        if (p.indexOf(b) !== 0) return;
        var r = p.slice(b.length).replace(/index\.html$/, "").replace(/\/$/, "");
        if (!r) return;
        var h = location.hash.replace(/^#/, "");
        try { history.replaceState(null, "", b + "#" + r + (h ? "~" + h : "")); } catch (e) {}
      })();
    </script>
    <!-- Set the theme before the first paint, so dark mode never flashes light text on a dark page. Mirrors the logic in Site.tsx. -->
    <script>
      (function () {
        var d = document.documentElement, t = d.dataset.theme, saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        if (t ? t === "dark" : saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) d.classList.add("dark");
        // The site opens in Indigo with Sharp corners. A saved choice (including Lime or Round) wins. The design system's
        // own defaults stay Lime and Round: that is what tokens.css gives a product that sets nothing.
        var p = "indigo", sh = "sharp";
        try { p = localStorage.getItem("palette") || p; sh = localStorage.getItem("shape") || sh; } catch (e) {}
        if (p !== "lime" && p !== "sandstone") d.dataset.palette = p;
        if (sh === "soft" || sh === "sharp") d.dataset.shape = sh;
      })();
    </script>
